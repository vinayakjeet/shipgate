name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        env:
          # Database-backed tests skip themselves when this is absent, so a fork
          # without the secret still gets a green, meaningful run.
          SHIPGATE_DB_URL: ${{ secrets.SHIPGATE_DB_URL }}
        run: uv run pytest
