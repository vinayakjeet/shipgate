# Nightly drift detection. A model can degrade with nothing in the repo changing,
# because the judge model moves under an alias and providers retune. Only a run on
# a schedule catches that, since nobody is opening a change to trigger the gate.
name: Nightly

on:
  schedule:
    # 02:17 UTC. Deliberately off the hour: every scheduled workflow on GitHub
    # asks for :00, and runs queued at peak get delayed the longest.
    - cron: "17 2 * * *"
  workflow_dispatch:

# A slow nightly run must not stack up behind itself on a free tier.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Score every registered dataset
        id: nightly
        env:
          SHIPGATE_DB_URL: ${{ secrets.SHIPGATE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          uv run python -m shipgate run \
            --dataset datasets/support-intent.jsonl \
            --trigger cron \
            --cache

      - name: Publish to the job summary
        if: always()
        run: |
          {
            echo "### Nightly run"
            echo ""
            echo "Dashboard: https://shipgate-890d.onrender.com/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue if the nightly run broke
        # A cron failure nobody sees is the same as no cron at all.
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly eval run failed";
            // One issue for the failure mode, not one per night, so a week of
            // breakage does not bury everything else.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "nightly-failure",
            });
            const body = `The nightly eval run failed.\n\n`
              + `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
              + `/actions/runs/${context.runId}\n\n`
              + `Usual causes: the free-tier quota was exhausted, or Neon was `
              + `suspended and the first connection timed out.`;

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["nightly-failure"],
                body,
              });
            }
